services:
  - type: web
    name: career-platform
    env: static
    buildCommand: npm run build
    staticPublishPath: client/build
    routes:
      # Serve static assets with proper caching
      - type: rewrite
        source: /static/js/*.js
        destination: /static/js/*.js
      
      - type: rewrite
        source: /static/css/*.css
        destination: /static/css/*.css
      
      - type: rewrite
        source: /static/media/*
        destination: /static/media/*
      
      # Authentication routes
      - type: rewrite
        source: /auth/login
        destination: /index.html
      
      - type: rewrite
        source: /auth/register
        destination: /index.html
      
      - type: rewrite
        source: /auth/verify-email
        destination: /index.html
      
      - type: rewrite
        source: /auth/reset-password
        destination: /index.html
      
      # Role-based routes
      - type: rewrite
        source: /admin/*
        destination: /index.html
      
      - type: rewrite
        source: /company/*
        destination: /index.html
      
      - type: rewrite
        source: /institution/*
        destination: /index.html
      
      - type: rewrite
        source: /student/*
        destination: /index.html
      
      # Root route
      - type: rewrite
        source: /
        destination: /index.html
      
      # Catch-all for SPA
      - type: rewrite
        source: /*
        destination: /index.html
