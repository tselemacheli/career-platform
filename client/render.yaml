services:
  - type: web
    name: career-platform
    env: static
    buildCommand: npm run build
    staticPublishPath: client/build
    headers:
      - path: /static/js/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/css/*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Serve static assets directly
      - type: rewrite
        source: /static/js/*.js
        destination: /static/js/*.js
      
      - type: rewrite
        source: /static/css/*.css
        destination: /static/css/*.css
      
      - type: rewrite
        source: /static/media/*
        destination: /static/media/*
      
      # Serve manifest and other asset files directly
      - type: rewrite
        source: /manifest.json
        destination: /manifest.json
      
      - type: rewrite
        source: /favicon.ico
        destination: /favicon.ico
      
      # For SPA routing, serve index.html for all non-asset routes
      - type: rewrite
        source: /*
        destination: /index.html
