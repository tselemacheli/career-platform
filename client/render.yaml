services:
  - type: web
    name: career-platform
    env: static
    buildCommand: npm run build
    staticPublishPath: client/build
    headers:
      - path: /static/js/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/css/*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Serve static assets directly
      - type: rewrite
        source: /static/js/*.js
        destination: /static/js/*.js
      
      - type: rewrite
        source: /static/css/*.css
        destination: /static/css/*.css
      
      - type: rewrite
        source: /static/media/*
        destination: /static/media/*
      
      # Authentication routes - serve index.html so React Router can handle them
      - type: rewrite
        source: /auth/login
        destination: /index.html
      
      - type: rewrite
        source: /auth/register
        destination: /index.html
      
      - type: rewrite
        source: /auth/verify-email
        destination: /index.html
      
      - type: rewrite
        source: /auth/reset-password
        destination: /index.html
      
      # Role-based routes - serve index.html so React Router can handle them
      - type: rewrite
        source: /admin/*
        destination: /index.html
      
      - type: rewrite
        source: /company/*
        destination: /index.html
      
      - type: rewrite
        source: /institution/*
        destination: /index.html
      
      - type: rewrite
        source: /student/*
        destination: /index.html
      
      # Root route
      - type: rewrite
        source: /
        destination: /index.html
      
      # Catch-all for SPA - this is essential for all other routes
      - type: rewrite
        source: /*
        destination: /index.html
